<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home page</title>
    <link rel="icon" href="/Icon.png" type="png">
    <link rel="stylesheet" href="/css/general.css">
    <script src="/js/form.js" defer></script>
    <script src="/js/weatherAPI.js" defer></script>
</head>
<body>
    <header>
        <h1>Portfoliosite T</h1>
    </header>
    <nav>
        <a href="/index.html"><button class="navButton">Home</button></a>
        <a href="/html/aboutMe.html"><button class="navButton">About me</button></a>
        <a href="/html/projects.html"><button class="navButton">Projects</button></a>
        <a href="/html/blog.html"><button class="navButton">Blog</button></a>
        <a href="/html/contact.html"><button class="navButton">Contact</button></a>
    </nav>

    <main>
        <h2>Contactformulier</h2>
        <p>Stel hier een vraag over de site.</p>

        <form id="contact-form" novalidate></form>
            <label for="naam">Naam</label>
            <input id="naam" required minlength="2" aria-describedby="naam-error" aria-invalid="false">
            <span id="naam-error" role="alert"></span>
            <br>

            <label for="email">Email</label>
            <input id="email" type="email" required aria-describedby="email-error" aria-invalid="false">
            <span id="email-error" role="alert"></span>
            <br>

            <label for="bericht">Stel hier je vraag</label>
            <textarea id="bericht" required minlength="10" aria-describedby="bericht-error" ariainvalid="false"></textarea>
            <span id="bericht-error" role="alert"></span>

            <button type="submit" id="contactButton">Versturen</button>
            <div id="form-status" aria-live="polite"></div>
        <form></form>
    </main>
    

</body>
</html>
